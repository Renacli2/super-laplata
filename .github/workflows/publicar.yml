# Publica la app y los precios en GitHub Pages.
#
# El portal de SEPA bloquea las descargas desde los servidores de GitHub (403 desde el 17/11/2026), así que el
# dump lo descarga la PC: scripts/actualizar-precios.ps1 genera los datos, los sube a la rama "datos" (un solo
# commit, se reemplaza cada día) y lanza este workflow. Este workflow solo compila la app y la publica con esos datos.
#
# Corre cuando se sube código a main, cuando lo lanza el script de la PC y a mano desde Actions ("Run workflow").
name: Publicar app y precios

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Traer los datos de la rama "datos"
        run: |
          if ! git fetch --depth=1 origin datos:refs/remotes/origin/datos; then
            echo "::error::Falta la rama 'datos'. Corré scripts/actualizar-precios.ps1 en la PC."
            exit 1
          fi
          mkdir -p site-data
          for f in version.json catalog.json prices.json; do
            git show "origin/datos:$f" > "site-data/$f"
          done
          echo "Datos del: $(grep -o '"date":"[^"]*"' site-data/version.json)"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Tests (los de PostgreSQL se omiten acá)
        run: dotnet test tests/Super.Tests -c Release

      - name: Compilar la app
        run: dotnet publish src/Super.Web -c Release -o out

      - name: Armar el sitio
        run: |
          cd out/wwwroot
          mkdir -p data
          cp ../../site-data/*.json data/
          # GitHub Pages devuelve 404.html para rutas como /comparar o /pedido: es la misma app.
          cp index.html 404.html
          # Sin esto, Jekyll ignora la carpeta _framework.
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/wwwroot
          # Desde la v4 deja afuera los archivos que empiezan con punto: así sigue incluyendo .nojekyll.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
